name: 全球风险日报

on:
  schedule:
    # UTC 03:00 = 北京时间 11:00；1-5 = 周一至周五
    - cron: "0 3 * * 1-5"
  workflow_dispatch: {}   # 允许在 GitHub 网页手动点一下立即测试

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成并推送日报
        env:
          # —— LLM（必填）——
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # —— 推送渠道（按需填写，没填的自动跳过）——
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}   # 微信推送
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}             # 企业微信机器人
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}       # 钉钉机器人
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}           # 飞书机器人
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}               # Telegram
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}                   # 邮箱推送
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USE_SSL: ${{ secrets.EMAIL_USE_SSL }}
        run: python generate_daily_risk_report.py

      - name: 提交日报到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_reports/ || true
          git commit -m "日报 $(date +%F -u)" || echo "无变化，跳过提交"
          git push
